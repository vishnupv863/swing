name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]

env:
  ACR_NAME: swingtrade
  RESOURCE_GROUP: my-resource-group
  BACKEND_APP: fastapi-backend
  FRONTEND_APP: react-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Check whether GitHub can access the Azure secrets
      # ---------------------------------------------------
      - name: Check Azure secrets
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "CLIENT_ID length: ${#CLIENT_ID}"
          echo "TENANT_ID length: ${#TENANT_ID}"
          echo "SUBSCRIPTION_ID length: ${#SUBSCRIPTION_ID}"

      # --------------------------------------------------
      # Login to Azure using OIDC
      # --------------------------------------------------
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------
      # Login to Azure Container Registry
      # --------------------------------------------------
      - name: Log in to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      # --------------------------------------------------
      # Build and push backend image
      # --------------------------------------------------
      - name: Build and push backend image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }} \
            ./backend

          docker push \
            ${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }}

      # --------------------------------------------------
      # Build and push frontend image
      # --------------------------------------------------
      - name: Build and push frontend image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }} \
            ./frontend

          docker push \
            ${{ env.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }}

      # --------------------------------------------------
      # Deploy backend Container App
      # --------------------------------------------------
      - name: Deploy backend to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }}

      # --------------------------------------------------
      # Deploy frontend Container App
      # --------------------------------------------------
      - name: Deploy frontend to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }}
